# Drop-in fuer die transiente Leitungs-Unit, angelegt 2026-08-07.
#
# WARUM ES DAS BRAUCHT: `klabs run` startet die Leitung ueber `systemd-run` und reicht dabei
# GENAU EINE Variable durch -- `--setenv=CEO_INSTANCE` (run_command in /usr/local/bin/klabs).
# Alles, was exec_ceo zuvor aus bridge.env gelesen hat, faellt still weg, darunter
# CEO_LLM_BASE_URL. Der Go-Kern nimmt dann seine eingebaute Vorgabe https://openrouter.ai/api
# und schickt den kirla_sk_-Schluessel dorthin, wo er nicht gilt: HTTP 401, "Missing
# Authentication header".
#
# Vor der Umstellung auf kirla.ai fiel das niemandem auf, weil die Vorgabe zufaellig richtig
# war. Der autonome Takt ist NICHT betroffen -- seine Unit benutzt EnvironmentFile=.
#
# Das gehoert eigentlich auf die klabs-Seite (der Bauauftrag §9 nennt `llm_route` in
# instance.json als "noch nicht gebaut"). Bis es das gibt, steht die Route hier -- an einer
# Stelle, die klabs nicht neu schreibt, und je Instanz einzeln.
[Service]
Environment=CEO_LLM_BASE_URL=https://api.kirla.ai

# ── EINRICHTUNG JE INSTANZ ──────────────────────────────────────────────────────────────
#   sudo mkdir -p /etc/systemd/system/kirla-<instanz>-leitung.service.d
#   sudo cp diese-datei /etc/systemd/system/kirla-<instanz>-leitung.service.d/10-kirla-api-route.conf
#   sudo systemctl daemon-reload
#
# Gegenprobe, ohne eine Sitzung zu starten:
#   sudo systemd-run --unit=kirla-<instanz>-leitung --wait --collect --quiet \
#        -- /bin/sh -c 'echo CEO_LLM_BASE_URL=$CEO_LLM_BASE_URL'
#   sudo journalctl -u kirla-<instanz>-leitung -n 3 --no-pager -o cat
