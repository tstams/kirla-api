# api.kirla.ai — die Zwischenstelle (kirla-api). Angelegt 2026-08-07.
#
# Getrennt von kirla.ai.conf und ohne Beruehrung damit: kirla.ai bleibt die statische
# Platzhalterseite (Betreiberentscheidung 07.08.), hier laeuft die Schnittstelle.
#
# Zertifikat: eigenes Let's-Encrypt-Zertifikat fuer api.kirla.ai, ausgestellt 07.08.2026,
# gueltig bis 05.11.2026. Erneuerung ueber dns-cloudflare wie die uebrigen Zertifikate
# dieses Hosts (/etc/letsencrypt/renewal/api.kirla.ai.conf), NICHT ueber den Webroot.

upstream kirla_api {
    server 127.0.0.1:8080;
    # Verbindungen offen halten. Ohne das baut nginx je Anfrage eine neue auf; bei den
    # 20-30 gleichzeitigen Stroemen aus dem Bauauftrag §6 ist das reine Verschwendung.
    keepalive 32;
}

server {
    listen 80; listen [::]:80;
    server_name api.kirla.ai;

    # Der ACME-Pfad bleibt, obwohl die Erneuerung ueber DNS laeuft: faellt jemand spaeter
    # auf den Webroot zurueck, funktioniert er sofort.
    include snippets/kirla-acme.conf;

    # KEINE WEITERLEITUNG AUF HTTPS, und das ist Absicht.
    #
    # Eine 301 auf einen POST ueberlebt den Koerper nicht: Gos http.Client -- und damit
    # klabs -- macht aus 301/302 bei POST eine GET-Anfrage OHNE Koerper. Der Betreiber,
    # der versehentlich http:// eingetragen hat, saehe dann einen Fehler von OpenRouter
    # ueber eine Anfrage, die er nie geschickt hat. Eine klare Auskunft ist hier mehr
    # wert als die Bequemlichkeit der Weiterleitung fuer den Browser.
    # Die Basis-URL steht hier OHNE /v1: klabs haengt "/v1/chat/completions" selbst an
    # (core/openrouter/openrouter.go:299). Ein /v1 in der Variable ergaebe /v1/v1/... und
    # einen 404, der wie ein Fehler der Zwischenstelle aussieht.
    location / {
        default_type application/json;
        return 426 '{"error":{"code":"kirla_nur_https","message":"Diese Schnittstelle spricht nur https. Bitte CEO_LLM_BASE_URL auf https://api.kirla.ai setzen (ohne /v1 - klabs haengt den Pfad selbst an)."}}';
    }
}

server {
    # `listen ... http2` und nicht `http2 on;`: nginx auf diesem Host ist 1.24.0, die
    # eigene Direktive gibt es erst ab 1.25.1. Dieselbe Schreibweise wie in kirla.ai.conf.
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name api.kirla.ai;

    ssl_certificate     /etc/letsencrypt/live/api.kirla.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kirla.ai/privkey.pem;
    include snippets/kirla-tls.conf;

    # ⛔ DIESER VHOST FOLGT DEM GLOBALEN SCHALTER NICHT -- wie kirla.ai.conf, aber aus
    # einem staerkeren Grund.
    #
    # Der Bauauftrag §0 und klabs ADR-0016 legen fest: der Vorbau bleibt oben, auch wenn
    # alles dahinter ausfaellt, weil an ihm die Verfuegbarkeit JEDER Kundenfirma haengt.
    # Wuerde dieser vhost dem hostweiten Symlink folgen, naehme ein `maintenance` fuer
    # Chronicle jeder Kundenfirma den Modellzugang -- nachts, unangekuendigt, und genau
    # gegen die Zusage, die das Produkt verkauft.
    #
    # DER PREIS, und er gehoert hierher: wer diesen Host in Wartung legt, nimmt die
    # Schnittstelle NICHT mit. Sie muss einzeln angehalten werden
    # (`systemctl stop kirla-api`), und das ist die richtige Reihenfolge -- eine bewusste
    # Handlung statt einer Nebenwirkung.
    include snippets/kirla-access-modes/public.conf;

    # Eine Schnittstelle gehoert nicht in einen Suchindex.
    add_header X-Robots-Tag "noindex, nofollow" always;

    access_log /var/log/nginx/api-kirla-ai.access.log kirla_anon;
    error_log  /var/log/nginx/api-kirla-ai.error.log warn;

    # 2 MB stehen in der Baseline (00-security-baseline.conf) und sind fuer eine
    # Chat-Anfrage zu wenig: Systemtext, Verlauf und die vollstaendigen
    # Werkzeugdefinitionen wachsen mit der Firma, und ein 413 von nginx saehe fuer den
    # Kunden aus wie ein Fehler von kirla.ai. 32 MB sind reichlich und bleiben begrenzt.
    client_max_body_size 32m;

    location / {
        proxy_pass http://kirla_api;
        proxy_http_version 1.1;

        # ── DIE VIER ZEILEN, OHNE DIE STREAMING NICHT STREAMT ──────────────────────
        #
        # proxy_buffering off: sonst sammelt nginx die Antwort und gibt sie am Stueck
        # weiter. Der Go-Dienst leert dann brav seinen Puffer, und nginx haelt trotzdem
        # alles zurueck -- der Kunde saehe minutenlang nichts und dann alles auf einmal.
        proxy_buffering off;
        # Dasselbe fuer die Gegenrichtung: der Koerper der Anfrage geht durch, statt
        # erst vollstaendig eingelesen zu werden.
        proxy_request_buffering off;
        # gzip wuerde die Bytes veraendern -- und "unveraendert durchreichen" ist die
        # Zusage aus §1. Die Vorgabe von gzip_proxied waere hier ohnehin `off`;
        # ausdrueckliches Abschalten haelt das fest, falls die Baseline sich aendert.
        gzip off;
        # Verbindung zum Upstream offen halten (braucht die leere Connection-Zeile).
        proxy_set_header Connection "";

        # ── ZEITGRENZEN ───────────────────────────────────────────────────────────────
        # Die Vorgabe von proxy_read_timeout ist 60 s. Ein Modellaufruf dauert laut §6
        # 5-60 s, und bei einer NICHT stroemenden Antwort kommt in dieser ganzen Zeit
        # kein einziges Byte -- die Vorgabe wuerde also genau die langsamen Aufrufe
        # abschneiden, und der Fehler saehe aus wie ein Problem des Anbieters.
        proxy_connect_timeout 5s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
